name: Compute Kestra Version
description: Computes the Kestra version from the current branch name

inputs:
  branch:
    description: Branch to resolve the version for (defaults to the PR base branch, else the current branch)
    required: false
    default: ""

outputs:
  kestra_version:
    description: The computed Kestra version
    value: ${{ steps.version.outputs.kestra_version }}

runs:
  using: composite
  steps:
    - name: Compute version from branch
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_BRANCH: ${{ inputs.branch }}
        # Kestra MAJOR.MINOR that main is released against; bumped by the PR merging next/v<X.Y> back.
        MAIN_KESTRA_LINE: "2.0"
      run: |
        resolve_version() {
          local branch_version="$1"
          if [[ "${branch_version}" == *.x ]]; then
            local prefix="${branch_version%.x}"
            curl -sf -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/kestra-io/kestra/releases?per_page=100" \
              | grep '"tag_name"' \
              | grep "\"${prefix}\." \
              | head -1 \
              | sed 's/.*"tag_name": "\(.*\)".*/\1/'
          else
            echo "${branch_version}"
          fi
        }
        branch="${INPUT_BRANCH:-${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}}"
        case "${branch}" in
          releases/*) kestra_version=$(resolve_version "${branch#releases/}") || true ;;
          next/*) kestra_version=develop ;;
          *) kestra_version=$(resolve_version "v${MAIN_KESTRA_LINE}.x") || true ;;
        esac
        if [[ -z "${kestra_version}" ]]; then
          echo "::error::Could not resolve the Kestra version for branch ${branch}"
          exit 1
        fi
        echo "Kestra version for ${branch}: ${kestra_version}"
        echo "kestra_version=${kestra_version}" >> $GITHUB_OUTPUT
