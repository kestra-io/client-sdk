name: Java SDK tests

on:
  push:
    branches:
      - main
      - "releases/v*"
      - "next/v*"
    paths:
      - 'java/**'
  pull_request:
    branches:
      - main
      - "releases/v*"
      - "next/v*"
    paths:
      - 'java/**'
  workflow_dispatch:
    inputs:
      skip-test:
        description: "Skip test"
        required: false
        type: choice
        options:
          - "true"
          - "false"
        default: "false"

# Serializes runs per branch and trigger: two close next/* pushes can't publish their snapshots out of order,
# and a test run dispatched on a new develop image never cancels a push that is publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/next/') }}

jobs:
  test:
    name: Test Java SDK
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
    defaults:
      run:
        working-directory: ./java/java-sdk
    steps:
      - uses: actions/checkout@v7

      - name: Compute Kestra version
        id: version
        uses: ./.github/actions/compute-version

      # Caches
      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*',
            '**/gradle*.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # JDK
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Static doc check — runs the JDK single-file tool (no Kestra container
      # needed, so it fails fast). Guarantees the README usage snippet is
      # identical to the CI-tested example (BasicSDKUsageExample.java). #144.
      - name: Check README example is in sync with its tested source
        run: java ../../test-utils/EmbedSnippets.java --check ../../README.md

      # Static doc check — validates every kestraClient.<accessor>().<method>(...)
      # call in docs/*.md against the hand-written SDK signatures (no JVM/server
      # needed). Catches the generator drift #222 left behind (#122).
      - name: Check docs/*.md examples match the SDK signatures
        run: python3 scripts/validate_doc_examples.py --check

      # Gradle check
      - name: Build with Gradle
        if: inputs.skip-test != 'true'
        run: ./gradlew check

      - name: GCP - Auth with github service account
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: configure docker access to GCP registry for EE image
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Select license file
        id: license
        uses: ./.github/actions/set-license-file
        with:
          kestra_version: ${{ steps.version.outputs.kestra_version }}
          license_file: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_FILE }}
          license_legacy_file: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE }}

      - name: Build local SDK and test it in an example project
        if: inputs.skip-test != 'true'
        env:
          KESTRA_VERSION: ${{ steps.version.outputs.kestra_version }}
        run: |
          echo "${{ steps.license.outputs.license }}" | base64 -d > ../../test-utils/docker-setup/application-secrets.yml
          sh run-tests.sh $KESTRA_VERSION

      - name: Test - Publish Test Results
        uses: dorny/test-reporter@v3
        if: inputs.skip-test != 'true'
        with:
          name: Java Tests Report (${{ steps.version.outputs.kestra_version }})
          reporter: java-junit
          path: "**/build/test-results/test/TEST-*.xml"
          list-suites: "all"
          list-tests: "all"
          fail-on-error: "false"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Slack - Notify CI failure
        if: failure() && github.event_name != 'pull_request'
        uses: kestra-io/actions/composite/slack-status@main
        with:
          channel: 'C09FE0QCN2E'
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          users-map: ${{ vars.GITHUB_TO_SLACK_MAP }}
          suffix: Java SDK

  publish-snapshot:
    name: Publish Java SDK snapshot
    needs: test
    # next/v<X.Y> publishes <X.Y>.0-SNAPSHOT to the Central Portal snapshots repository
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/next/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./java/java-sdk
    steps:
      - uses: actions/checkout@v7

      - name: Resolve snapshot version from branch
        id: version
        run: |
          LINE="${GITHUB_REF_NAME#next/v}"
          if [[ ! "$LINE" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME does not match next/v<X.Y>"
            exit 1
          fi
          echo "version=$LINE.0-SNAPSHOT" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Publish - Snapshot package to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_GPG_KEYID: ${{ secrets.SONATYPE_GPG_KEYID }}
          SONATYPE_GPG_PASSWORD: ${{ secrets.SONATYPE_GPG_PASSWORD }}
          SONATYPE_GPG_FILE: ${{ secrets.SONATYPE_GPG_FILE}}
        run: |
          mkdir -p ~/.gradle/
          echo "signing.keyId=${SONATYPE_GPG_KEYID}" > ~/.gradle/gradle.properties
          echo "signing.password=${SONATYPE_GPG_PASSWORD}" >> ~/.gradle/gradle.properties
          echo "signing.secretKeyRingFile=${HOME}/.gradle/secring.gpg" >> ~/.gradle/gradle.properties
          echo ${SONATYPE_GPG_FILE} | base64 -d > ~/.gradle/secring.gpg
          ./gradlew publishToMavenCentral -Pversion=${{ steps.version.outputs.version }}

      - name: Slack - Notify snapshot failure
        if: failure()
        uses: kestra-io/actions/composite/slack-status@main
        with:
          channel: 'C09FE0QCN2E'
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          users-map: ${{ vars.GITHUB_TO_SLACK_MAP }}
          suffix: Java SDK snapshot
