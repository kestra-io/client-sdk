name: SDK freshness check (latest Kestra)

# Daily, non-blocking early-warning run. It exercises every SDK's e2e test
# suite on two targets so we catch API breaking changes proactively instead of
# discovering the drift at release time (#250):
#   - `next`: the newest next/v<X.Y> branch against a Kestra EE server built
#     from `develop` (skipped when there is none); a 401 storm or schema
#     mismatch here is a *signal*.
#   - `main`: main against the latest patch of its Kestra line, which catches
#     a new patch release breaking main between two SDK changes.
#
# This workflow deliberately:
#   - skips the code-hygiene checks (README-sync, generate-diff) that the per-PR
#     workflows run — those validate the repo, not drift against the live server.
#   - never gates PRs/releases: it only runs on a schedule / manual dispatch and
#     must not be added to branch-protection required checks.

on:
  schedule:
    - cron: "0 5 * * *" # every day 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  next-branch:
    name: Find the newest next/* branch
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.find.outputs.branch }}
      targets: ${{ steps.find.outputs.targets }}
    steps:
      # Without a next/* branch, only main is checked: main against develop would alert every day.
      - id: find
        run: |
          branch=$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}" 'refs/heads/next/v*' \
            | sed 's|.*refs/heads/||' | sort -V | tail -1)
          echo "branch=${branch}" >> $GITHUB_OUTPUT
          echo "targets=$([ -n "$branch" ] && echo '["next","main"]' || echo '["main"]')" >> $GITHUB_OUTPUT

  check:
    name: ${{ matrix.sdk }} SDK (${{ matrix.target }})
    needs: next-branch
    # setup-python has no Python 3.9 build for Ubuntu 26.04 (ubuntu-latest)
    runs-on: ${{ matrix.sdk == 'python' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false # one SDK failing must not hide the others
      matrix:
        sdk: [python, go, java, javascript]
        target: ${{ fromJSON(needs.next-branch.outputs.targets) }}
    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.target == 'next' && needs.next-branch.outputs.branch || 'main' }}

      - name: Compute Kestra version
        id: main-version
        if: matrix.target == 'main'
        uses: ./.github/actions/compute-version
        with:
          branch: main

      - name: Set Kestra version
        run: echo "KESTRA_VERSION=${{ matrix.target == 'next' && 'develop' || steps.main-version.outputs.kestra_version }}" >> $GITHUB_ENV

      # --- SDK-specific toolchains (only the matching leg's steps run) ---
      - name: Set up Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.9.23"

      - name: Set up Go
        if: matrix.sdk == 'go'
        uses: actions/setup-go@v7

      - name: Set up JDK
        if: matrix.sdk == 'java'
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25

      - name: Set up Node
        if: matrix.sdk == 'javascript'
        uses: actions/setup-node@v7
        with:
          node-version: "22.18"

      # --- Shared: pull + license the EE image ---
      - name: GCP - Auth with github service account
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: configure docker access to GCP registry for EE image
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Select license file
        id: license
        uses: ./.github/actions/set-license-file
        with:
          kestra_version: ${{ env.KESTRA_VERSION }}
          license_file: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_FILE }}
          license_legacy_file: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_LEGACY_FILE }}

      - name: Write application secrets
        run: echo "${{ steps.license.outputs.license }}" | base64 -d > test-utils/docker-setup/application-secrets.yml

      # --- Run each SDK's existing test suite against the live server ---
      - name: Test Python SDK
        if: matrix.sdk == 'python'
        working-directory: ./python/python-sdk
        run: bash run-tests.sh "$KESTRA_VERSION"

      - name: Test Go SDK
        if: matrix.sdk == 'go'
        working-directory: ./go-sdk
        run: sh run-tests.sh "$KESTRA_VERSION"

      - name: Test Java SDK
        if: matrix.sdk == 'java'
        working-directory: ./java/java-sdk
        run: sh run-tests.sh "$KESTRA_VERSION"

      # JS generates from the committed spec, then e2e-tests against the live
      # server — so drift between the committed spec and the live API
      # surfaces as failing tests.
      - name: Generate JavaScript SDK
        if: matrix.sdk == 'javascript'
        run: ./generate-sdks.sh javascript

      - name: Test JavaScript SDK
        if: matrix.sdk == 'javascript'
        working-directory: ./javascript
        run: sh run-tests.sh "$KESTRA_VERSION" --no-build

      # --- Alert only on failure ---
      # Uses the org-standard composite (kestra-io/actions/composite/slack-status)
      # so the channel override actually routes: it embeds `channel` inside the
      # Slack payload, which the org SLACK_WEBHOOK_URL webhook honours. Posting
      # via 8398a7/action-slack with `status: custom` dropped the channel input
      # and the message fell back to the webhook's default DM destination.
      - name: Notify Slack on failure
        if: failure()
        uses: kestra-io/actions/composite/slack-status@main
        with:
          channel: "C09FE0QCN2E" # #_int_alert-plugins-build
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          suffix: ${{ matrix.sdk }} SDK (${{ matrix.target }}) vs Kestra ${{ env.KESTRA_VERSION }}
          users-map: ${{ vars.GITHUB_TO_SLACK_MAP }}
          extra-text: "regenerate the SDK from the latest spec, or treat as a real upstream breaking change"
